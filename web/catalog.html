<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Tamil Films World — Movies</title><link rel="stylesheet" href="/style.css?v=20261028-6"><style>.catalog-wrap{max-width:1100px;margin:auto;padding:32px 20px 70px}.catalog-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:30px}.catalog-top a{color:#343b46;text-decoration:none;font-weight:600;font-size:13px}.catalog-search{max-width:480px;margin:0 0 24px}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}.film-card{border:0;background:transparent;text-align:left;cursor:pointer;padding:0;color:inherit}.film-poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e9ebef;border-radius:12px}.film-title{font-size:14px;font-weight:650;margin-top:10px;display:block}.film-meta{font-size:12px;color:#727b88;margin-top:4px;display:block}.film-dialog{border:1px solid #e5e7eb;border-radius:16px;max-width:540px;width:calc(100% - 32px);padding:24px;color:#20252d;box-shadow:0 18px 70px #11182725}.film-dialog::backdrop{background:#11182780}.film-dialog img{max-width:160px;width:42%;border-radius:10px;float:left;margin:0 18px 12px 0}.film-dialog p{font-size:14px}.film-dialog button{border:1px solid #d8dde5;background:#fff;border-radius:9px;padding:10px 14px}.film-dialog .actions{clear:both;display:flex;gap:10px;flex-wrap:wrap;padding-top:16px}.film-dialog .actions a{background:#252b35;color:white;border-radius:9px;padding:11px 16px;text-decoration:none;font-size:13px}.film-empty{color:#697286;font-size:14px}.catalog-top h1{font-size:clamp(21px,4vw,27px)}@media(max-width:480px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}</style></head><body><div class="catalog-wrap"><header class="catalog-top"><h1>Tamil Films World</h1><a href="/request">Request a movie</a></header><input class="catalog-search" id="catalog-search" type="search" placeholder="Search movies…" aria-label="Search movies"><main><div id="catalog-grid" class="catalog-grid"></div><p id="catalog-empty" class="film-empty" hidden>No movies available yet.</p></main></div><dialog id="film-dialog" class="film-dialog"><div id="film-detail"></div><div class="actions"><a id="request-link" href="/request">Request via WhatsApp</a><button id="film-close" type="button">Close</button></div></dialog><script src="/catalog.js?v=20261028-6" defer></script></body></html>
