<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>AutoWA — Verified Requests</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9ebf8;background:#090b15}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#211b43,#090b15 65%)}main{width:min(100%,520px);padding:32px;border:1px solid #353451;border-radius:24px;background:#111322;box-shadow:0 25px 90px #0006}h1{font-size:28px;margin:0 0 8px}p{color:#b4b8cc;line-height:1.5}label{display:block;font-size:14px;margin:20px 0 8px}input,select,button{width:100%;font:inherit;border-radius:12px;padding:13px;border:1px solid #43465d;background:#191d30;color:#fff}input:focus,select:focus{outline:2px solid #8d78ff}button{margin-top:18px;border:0;background:#624ce7;cursor:pointer;font-weight:650}button:disabled{opacity:.55;cursor:wait}.inline{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.check{display:flex;align-items:start;gap:10px}.check input{width:auto;margin-top:3px}.check label{margin:0}.small{font-size:12px}.hidden{display:none!important}#message{min-height:22px;color:#c5b8ff;margin-top:16px}footer{margin-top:24px;font-size:12px;color:#8d91a8}</style></head><body><main><h1>AutoWA <span aria-hidden="true">✦</span></h1><p>Request delivery of media you have permission to share. Verify your own WhatsApp number first.</p><form id="start"><label for="country">Country / region</label><select id="country" required><option value="94">Sri Lanka (+94)</option></select><label for="phone">WhatsApp phone number</label><input id="phone" required autocomplete="tel-national" inputmode="tel" placeholder="077 123 4567"><button type="submit">Send verification code</button></form><form id="verify" class="hidden"><label for="code">6-digit WhatsApp verification code</label><input id="code" required maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code"><button type="submit">Verify number</button></form><form id="request" class="hidden"><label for="title">Movie / media title</label><input id="title" required maxlength="140" minlength="2"><label for="source">Direct HTTPS media URL</label><input id="source" type="url" required pattern="https://.*" placeholder="https://example.com/authorized-media.mp4"><div class="check"><input id="rights" type="checkbox" required><label for="rights">I confirm I have the rights and permission to distribute this media to the recipients.</label></div><button type="submit">Submit for review</button></form><p id="message" role="status" aria-live="polite"></p><footer>OTP expires after 5 minutes. Verification is temporary. Requests require approval and are not guaranteed to be delivered.</footer></main><script src="/app.js" defer></script></body></html>
