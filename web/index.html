<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>AutoWA — Verified Requests</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>AutoWA <span aria-hidden="true">✦</span></h1><p>Request delivery of media you have permission to share. Verify your own WhatsApp number first.</p><form id="start"><label for="country">Country / region</label><select id="country" required><option value="94">Sri Lanka (+94)</option></select><label for="phone">WhatsApp phone number</label><input id="phone" required autocomplete="tel-national" inputmode="tel" placeholder="077 123 4567"><button type="submit">Send verification code</button></form><form id="verify" class="hidden"><label for="code">6-digit WhatsApp verification code</label><input id="code" required maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code"><button type="submit">Verify number</button></form><form id="request" class="hidden"><label for="title">Movie / media title</label><input id="title" required maxlength="140" minlength="2"><label for="source">Direct HTTPS media URL</label><input id="source" type="url" required pattern="https://.*" placeholder="https://example.com/authorized-media.mp4"><label for="expected_size_mib">Expected media size (MiB, optional)</label><input id="expected_size_mib" type="number" min="1" max="1907" step="0.01" inputmode="decimal" placeholder="e.g. 908.50"><div class="check"><input id="rights" type="checkbox" required><label for="rights">I confirm I have the rights and permission to distribute this media to the recipients.</label></div><button type="submit">Submit for review</button></form><p id="message" role="status" aria-live="polite"></p><footer>OTP expires after 5 minutes. Verification is temporary. Requests require approval and are not guaranteed to be delivered.</footer></main><script src="/app.js" defer></script></body></html>
