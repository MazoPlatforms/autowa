<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#09090b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><title>Tamil Films World — Movie Requests</title><link rel="stylesheet" href="/style.css?v=20261028-8"><style>header.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px}header.app-header #profile-avatar{display:grid;place-items:center;position:static;width:42px;height:42px;min-width:42px;max-width:42px;min-height:42px;max-height:42px;flex:0 0 42px;border-radius:50%;margin:0;padding:0;background:#27272a;color:#f4f4f5;border:1px solid #52525b}header.app-header #profile-avatar.hidden{display:none!important}</style></head><body><main><header class="app-header"><h1>Tamil Films World</h1><button id="profile-avatar" class="avatar-button hidden" type="button" aria-label="Open profile"><span id="avatar-initials">?</span></button><button id="profile-back" class="back-button hidden" type="button">Back</button></header><section class="card"><p id="auth-intro">Request delivery of media you have permission to share. Verify your own WhatsApp number first.</p><form id="start"><label for="country">Country / region</label><select id="country" required><option value="94">Sri Lanka (+94)</option></select><label for="phone">WhatsApp phone number</label><input id="phone" required autocomplete="tel-national" inputmode="tel" placeholder="077 123 4567"><button class="primary-button" type="submit">Send verification code</button></form><form id="verify" class="hidden"><label for="code">6-digit WhatsApp verification code</label><input id="code" required maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code"><button class="primary-button" type="submit">Verify number</button></form><section id="account" class="hidden"><h2>My account</h2><p id="account-number"></p><label for="profile-name">Display name</label><input id="profile-name" maxlength="60" minlength="2" placeholder="Your name"><button class="primary-button" type="button" id="save-profile">Save profile</button><p id="account-limits" class="small"></p><button type="button" id="logout" class="secondary-button">Log out</button></section><form id="request" class="hidden"><label for="movie-search">Search movies</label><div class="movie-picker"><input id="movie-search" type="search" autocomplete="off" placeholder="Search available movies…" role="combobox" aria-expanded="false" aria-controls="movie-options" aria-autocomplete="list" required><input id="movie-id" type="hidden"><div id="movie-options" class="movie-options hidden" role="listbox"></div></div><div class="check"><input id="rights" type="checkbox" required><label for="rights">I confirm I have the rights and permission to distribute this media to the recipients.</label></div><button class="primary-button" type="submit">Submit for review</button></form><p id="message" role="status" aria-live="polite"></p><footer>OTP expires after 5 minutes. Sign-in lasts up to 30 days on this device. Requests require approval and are not guaranteed to be delivered.</footer></section></main><script src="/app.js?v=20261028-8" defer></script></body></html>
