name: Extract missing anime frames
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Optional anime title filter'
        required: false
        default: 'Attack on Titan'
      special_only:
        description: 'Only OAD episodes'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install telethon==1.42.0
      - name: Extract frames from the existing streaming path
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          FRAME_TITLE: ${{ inputs.title }}
          FRAME_SPECIAL_ONLY: ${{ inputs.special_only && '1' || '0' }}
        run: python scripts/extract-anime-frames.py
      - name: Commit generated frames and catalog references
        run: |
          if [ -z "$(git status --porcelain -- data/anime.json data/anime web/frames/anime)" ]; then
            echo "No missing frames found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime.json data/anime web/frames/anime
          git commit -m "chore: add extracted anime episode frames"
          git pull --rebase origin main
          git push origin HEAD:main
