name: Continuously copy Dan Da Dan anime

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: copy-dan-da-dan-anime
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install telethon==1.42.0
      - name: Copy new Dan Da Dan MKV/MP4 files
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          SOURCE_CHANNEL: Solo_leveling_tamil_ongoing
          COPY_TITLE: Dan Da Dan
          COPY_SLUG: dan-da-dan
          ALLOW_VIDEO_SOURCE: '1'
          DRY_RUN: '0'
          REVIEW_ONLY: '0'
        run: python scripts/copy_solo_leveling_anime.py
