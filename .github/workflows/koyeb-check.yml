name: Check Koyeb service
on:
  push:
    paths:
      - 'src/server.mjs'
      - 'src/whatsapp-otp.mjs'
      - 'src/stage-request.mjs'
      - 'src/linked-*.mjs'
      - 'test/linked-whatsapp.test.mjs'
      - 'test/request-link-state.test.mjs'
      - 'web/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/koyeb-check.yml'
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: |
          node --check src/server.mjs
          node --check src/whatsapp-otp.mjs
          node --check src/stage-request.mjs
          node --test test/linked-whatsapp.test.mjs test/request-link-state.test.mjs
          node --check web/player-ui.js
          node --check web/catalog.js
          node --check web/anime-watch.js
          node --check src/linked-whatsapp-runtime.mjs
          node --check web/linked-whatsapp.js
          node --check web/app.js
          test -s web/style.css
      - name: Container build
        run: docker build -t autowa-koyeb-check .
