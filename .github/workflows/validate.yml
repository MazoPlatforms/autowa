name: Validate submissions
on:
  pull_request:
    paths: ['movies/**', 'src/validate.mjs', '.github/workflows/validate.yml']
  push:
    paths: ['movies/**', 'src/validate.mjs']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/validate.mjs
