name: Sync anime catalog
on:
  repository_dispatch:
    types: [filmgo-anime-catalog-sync]
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: write
concurrency:
  group: anime-catalog-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Telegram secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          required = ('TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'TELEGRAM_SESSION', 'TELEGRAM_ANIME_CHANNEL_ID')
          missing = [name for name in required if not os.getenv(name, '').strip()]
          if missing:
              print('::error::Missing production environment secrets: ' + ', '.join(missing))
              sys.exit(1)
          try:
              int(os.environ['TELEGRAM_API_ID']); int(os.environ['TELEGRAM_ANIME_CHANNEL_ID'])
          except ValueError:
              print('::error::Telegram IDs must be integers'); sys.exit(1)
          PY
      - run: python -m pip install telethon==1.42.0
      - name: Build anime catalog from Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python src/telegram_media.py index-anime > /tmp/anime-catalog.json
      - name: Publish anime catalog safely against latest main
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json
          source=json.load(open('/tmp/anime-catalog.json', encoding='utf-8'))
          def fixed_slug(message_id):
              digest=hashlib.sha256(f'filmgo-anime-episode:{int(message_id)}'.encode()).digest()[:12]
              return base64.urlsafe_b64encode(digest).decode().rstrip('=')
          try:
              previous=json.load(open('data/anime.json', encoding='utf-8'))
          except (FileNotFoundError, json.JSONDecodeError):
              previous={}
          for item in source.get('anime', []):
              for episode in item.get('episodes', []):
                  variants=episode.get('qualities') or {str(episode.get('quality') or '720P').upper(): episode}
                  episode['slug_id']=episode.get('slug_id') or fixed_slug(next(iter(variants.values())).get('telegram_message_id'))
                  for variant in variants.values():
                      variant.pop('slug_id', None)
                      variant.pop('slug_aliases', None)
                  episode.pop('slug_aliases', None)
              grouped={}
              for episode in item.get('episodes', []):
                  identity=(episode.get('special_type') or '', int(episode.get('season') or 1), int(episode.get('episode') or episode.get('number') or 0), int(episode.get('part') or 0))
                  entry=grouped.setdefault(identity, {})
                  variants=episode.get('qualities') or {str(episode.get('quality') or '720P').upper(): episode}
                  entry.update(variants)
              compact=[]
              for variants in grouped.values():
                  preferred=next((key for key in variants if key.casefold()=='720p'), sorted(variants, key=lambda key: int(''.join(ch for ch in key if ch.isdigit()) or 0), reverse=True)[0])
                  primary=dict(variants[preferred]); primary['qualities']=variants; compact.append(primary)
              item['episodes']=compact
          output={'schema_version':1,'updated_at':source.get('indexed_at'),'anime':source.get('anime',[])}
          priority={'naruto': 0, 'naruto-shippuden': 1}
          output['anime'].sort(key=lambda item: (priority.get(item.get('slug_id'), 99), str(item.get('title', '')).casefold()))
          for item in output['anime']:
              if item.get('slug_id') == 'naruto':
                  item['season_banners']={str(number): f'/banners/naruto-season-{number}.webp' for number in range(1, 12)}
              if item.get('slug_id') == 'attack-on-titan':
                  item['season_banners']={'OAD':'/banners/attack-on-titan-oad.webp', **{str(number): f'/banners/attack-on-titan-season-{number}.webp' for number in range(1, 5)}}
          json.dump(output, open('/tmp/updated-anime.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          open('/tmp/updated-anime.json','a').write('\n')
          import os
          os.makedirs('data/anime', exist_ok=True)
          index={'schema_version':1,'updated_at':output.get('updated_at'),'anime':[]}
          for item in output['anime']:
              with open(f"data/anime/{item['slug_id']}.json", 'w', encoding='utf-8') as handle:
                  json.dump({'schema_version':1,'updated_at':output.get('updated_at'),'anime':item}, handle, ensure_ascii=False, indent=2)
                  handle.write('\n')
              index['anime'].append({key:value for key,value in item.items() if key != 'episodes'})
          with open('data/anime/index.json', 'w', encoding='utf-8') as handle:
              json.dump(index, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY
          cp /tmp/updated-anime.json data/anime.json
          if git diff --quiet -- data/anime.json data/anime; then echo "No anime catalog changes to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime.json data/anime
          git commit -m "chore: refresh anime catalog"
          git pull --rebase origin main
          git push origin HEAD:main
