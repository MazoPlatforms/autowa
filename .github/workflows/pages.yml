name: Deploy job dashboard
on:
  push:
    branches: [main]
    paths: ['movies/**', 'src/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Sync all joined groups
        env:
          WA_AUTH_CREDS: ${{ secrets.WA_AUTH_CREDS }}
        run: node src/sync-public-groups.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-groups
          path: site/groups.json
          retention-days: 1
  deploy:
    needs: sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: public-groups
          path: site
      - run: node src/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
