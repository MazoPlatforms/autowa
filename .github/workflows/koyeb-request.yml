name: Process verified AutoWA request
on:
  repository_dispatch:
    types: [autowa-verified-request]
permissions:
  contents: write
concurrency:
  group: whatsapp-publisher
  cancel-in-progress: false
jobs:
  review-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram client
        run: python3 -m pip install telethon==1.42.0
      - name: Validate request and stage private job
        id: stage
        env:
          REQUEST_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node src/stage-request.mjs
      - name: Send authorized media
        id: publish
        env:
          WA_AUTH_CREDS: ${{ secrets.WA_AUTH_CREDS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          JOB_ID: request-${{ github.event.client_payload.request_id }}
        run: node src/publish.mjs
      - name: Save sanitized movie history
        if: always()
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          REQUEST_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
        run: node src/save-request-history.mjs
      - name: Commit movie history
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- movies)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add movies/
            git commit -m "chore: archive verified media request [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
