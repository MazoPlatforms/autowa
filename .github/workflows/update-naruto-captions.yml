name: Normalize all anime captions and slugs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without editing Telegram messages"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install telethon==1.42.0
      - name: Update Telegram captions
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/update_anime_captions.py
      - name: Rebuild anime catalog from normalized captions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/dispatches -f event_type=filmgo-anime-catalog-sync
