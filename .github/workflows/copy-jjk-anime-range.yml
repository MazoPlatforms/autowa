name: One-time copy Jujutsu Kaisen anime range

on:
  workflow_dispatch:
    inputs:
      source_channel:
        description: Source Telegram username or ID
        required: true
        default: New_Tamill_Movies
      start_message_id:
        description: First source message ID (inclusive)
        required: true
        default: '328'
      end_message_id:
        description: Last source message ID (inclusive)
        required: true
        default: '548'

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install telethon==1.42.0
      - name: Validate range
        env:
          START_MESSAGE_ID: ${{ inputs.start_message_id }}
          END_MESSAGE_ID: ${{ inputs.end_message_id }}
        run: |
          python - <<'PY'
          import os, sys
          start, end = int(os.environ['START_MESSAGE_ID']), int(os.environ['END_MESSAGE_ID'])
          if start > end or start < 1:
              sys.exit('Invalid message range')
          PY
      - name: Copy MKV messages with FilmGo captions
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          SOURCE_CHANNEL: ${{ inputs.source_channel }}
          START_MESSAGE_ID: ${{ inputs.start_message_id }}
          END_MESSAGE_ID: ${{ inputs.end_message_id }}
        run: python scripts/copy_jjk_anime_range.py
