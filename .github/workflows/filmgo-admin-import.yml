name: FilmGo admin media import
on:
  repository_dispatch:
    types: [filmgo-admin-import]
permissions:
  contents: read
concurrency:
  group: filmgo-admin-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media clients
        run: python -m pip install telethon==1.42.0 gdown==5.2.0
      - name: Validate admin and download to Telegram
        env:
          FILMGO_IMPORT_JSON: ${{ toJSON(github.event.client_payload) }}
          FILMGO_BOT_ADMIN_ID: '7744742903'
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/filmgo_admin_import.py
