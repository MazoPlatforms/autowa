name: Publish authorized media
on:
  push:
    branches: [main]
    paths: ['movies/*.json']
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Enabled job ID (blank = all enabled jobs)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: whatsapp-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/validate.mjs
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Publish
        env:
          WA_AUTH_CREDS: ${{ secrets.WA_AUTH_CREDS }}
          JOB_ID: ${{ inputs.job_id }}
        run: node src/publish.mjs
      - name: Save assigned job IDs and results
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- movies)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add movies/
            git commit -m "chore: record movie processing jobs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
