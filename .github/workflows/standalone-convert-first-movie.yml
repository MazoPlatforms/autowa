name: Standalone convert one movie

on:
  workflow_dispatch:
    inputs:
      movie_index:
        description: 'Zero-based index in data/movies.json'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: standalone-movie-converter
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check telethon==1.42.0
      - name: Validate standalone secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION TELEGRAM_CHANNEL_ID BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing production secret: $name"; exit 1; fi
          done
          case "$TELEGRAM_API_ID" in (*[!0-9]*|'') echo '::error::TELEGRAM_API_ID must be numeric'; exit 1;; esac
          case "$TELEGRAM_CHANNEL_ID" in (*[!0-9-]*|'') echo '::error::TELEGRAM_CHANNEL_ID must be numeric'; exit 1;; esac
      - name: Convert and publish first movie only
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python scripts/standalone_convert_movie.py --movie-index "${{ inputs.movie_index }}"
      - name: Remove any temporary media from the runner
        if: always()
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'filmgo-standalone-*' -exec rm -rf -- {} +
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \( -name '*.download' -o -name '*.mkv' -o -name '*.mp4' -o -name '*.mka' \) -delete
