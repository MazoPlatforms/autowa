name: Sync movie metadata catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: movie-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required secrets without exposing values
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          required = ('TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'TELEGRAM_SESSION', 'TELEGRAM_CHANNEL_ID', 'OMDB_API_KEY')
          missing = [name for name in required if not os.getenv(name, '').strip()]
          if missing:
              print('::error::Missing GitHub Actions repository secrets: ' + ', '.join(missing))
              print('Configure these in Settings > Secrets and variables > Actions; Koyeb secrets are not shared with GitHub.')
              sys.exit(1)
          for name in ('TELEGRAM_API_ID', 'TELEGRAM_CHANNEL_ID'):
              try:
                  int(os.environ[name])
              except ValueError:
                  print('::error::' + name + ' must be a valid integer')
                  sys.exit(1)
          print('Required secret names are present and numeric IDs are valid.')
          PY
      - run: python -m pip install telethon==1.42.0
      - name: Update catalog from Telegram and OMDb
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/sync_movie_catalog.py
      - name: Commit changed catalog
        run: |
          if ! git diff --quiet -- data/movies.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/movies.json
            git commit -m "chore: refresh movie metadata catalog"
            git push
          fi
