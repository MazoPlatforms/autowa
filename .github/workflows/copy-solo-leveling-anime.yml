name: One-time copy Solo Leveling anime

on:
  workflow_dispatch:
    inputs:
      source_channel:
        description: Source Telegram username or ID
        required: true
        default: Solo_leveling_tamil_ongoing
      dry_run:
        description: Inspect source files without copying
        required: true
        default: 'false'

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install telethon==1.42.0
      - name: Copy document MKV/MP4 files
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_ANIME_CHANNEL_ID: ${{ secrets.TELEGRAM_ANIME_CHANNEL_ID }}
          SOURCE_CHANNEL: ${{ inputs.source_channel }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/copy_solo_leveling_anime.py
